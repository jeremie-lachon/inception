services:
  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    env_file: .env
    networks:
      - inception
    restart: unless-stopped
    volumes:
      - mariadb:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password
  
  wordpress:
    build: requirements/wordpress
    container_name: wordpress
    env_file: .env
    networks:
      - inception
    restart: unless-stopped
    volumes:
      - wordpress:/var/www/html/wordpress
    depends_on:
      - mariadb
    secrets:
      - db_password
      - credentials
  
  nginx:
    build: requirements/nginx
    container_name: nginx
    env_file: .env
    networks:
      - inception
    restart: unless-stopped
    volumes:
      - wordpress:/var/www/html/wordpress
    ports:
      - "443:443"
    depends_on:
      - wordpress
  
networks:
  inception:
    driver: bridge
  
volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/jla-chon/data/mariadb
  
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/jla-chon/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt